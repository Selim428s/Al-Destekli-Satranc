<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Destekli Satranç v1.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; }
        .board-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-template-rows: repeat(8, minmax(0, 1fr)); aspect-ratio: 1; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-between p-4">
    
    <!-- ANA MENÜ EKRANI -->
    <div id="mainMenu" class="fixed inset-0 bg-slate-900 flex flex-col items-center justify-center p-6 z-50">
        <div class="w-20 h-20 bg-slate-800 rounded-2xl flex items-center justify-center border border-slate-700 shadow-xl mb-6">
            <span class="text-4xl">♟️</span>
        </div>
        <h1 class="text-3xl font-extrabold tracking-wide mb-2 text-center">AI Destekli Satranç</h1>
        <p class="text-slate-400 text-sm mb-8 text-center">Yapay zekaya karşı yeteneklerini test et!</p>
        
        <div class="w-full max-w-xs flex flex-col gap-4">
            <button onclick="startGame()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg text-lg">
                Oyuna Başla
            </button>
            <div class="bg-slate-800 border border-slate-700 px-4 py-3 rounded-xl flex items-center justify-between">
                <span class="text-sm text-slate-300 font-medium">Zorluk Seviyesi:</span>
                <select id="menuDifficulty" class="bg-slate-900 text-white border border-slate-700 rounded-lg px-2 py-1 text-sm focus:outline-none">
                    <option value="easy">Kolay (Çok Basit)</option>
                    <option value="normal" selected>Normal</option>
                    <option value="hard">Zor</option>
                </select>
            </div>
        </div>
    </div>

    <!-- OYUN EKRANI -->
    <header class="w-full max-w-md flex flex-col items-center gap-2 my-2">
        <div class="flex justify-between items-center w-full px-2">
            <h1 class="text-xl font-bold tracking-wide">AI Destekli Satranç v1.5</h1>
            <button onclick="returnToMenu()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg transition text-slate-300">
                Ana Menü
            </button>
        </div>
        <div class="flex items-center justify-between w-full bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 text-sm">
            <span class="text-slate-400">Aktif Zorluk:</span>
            <span id="activeDifficultyText" class="font-semibold text-indigo-400 uppercase">Normal</span>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center">
        <div id="status" class="text-sm font-medium text-slate-300 mb-2">Sıra sizde (Beyaz)</div>
        <div id="board" class="board-grid w-full rounded-2xl overflow-hidden shadow-2xl border-4 border-slate-700 bg-slate-800"></div>
    </main>

    <footer class="w-full max-w-md flex justify-center gap-4 my-4">
        <button onclick="resetGame()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-medium px-5 py-2.5 rounded-xl transition shadow-lg">
            Yeniden Başlat
        </button>
    </footer>

    <!-- OYUN SONU MODALI -->
    <div id="gameModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <h3 id="modalTitle" class="text-2xl font-bold mb-2">Oyun Bitti</h3>
            <p id="modalMessage" class="text-slate-300 mb-6">Sonuç durumu.</p>
            <button onclick="resetGame(); closeModal();" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-xl transition">
                Tekrar Oyna
            </button>
        </div>
    </div>

    <!-- PİYON TERFİ SEÇİM MODALI -->
    <div id="promotionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl">
            <h3 class="text-xl font-bold mb-4">Piyon Terfisi</h3>
            <p class="text-slate-300 text-sm mb-4">Lütfen yeni taşı seçin:</p>
            <div class="flex justify-center gap-3">
                <button onclick="selectPromotion('q')" class="w-14 h-14 bg-slate-700 hover:bg-indigo-600 rounded-xl text-3xl flex items-center justify-center transition">♕</button>
                <button onclick="selectPromotion('r')" class="w-14 h-14 bg-slate-700 hover:bg-indigo-600 rounded-xl text-3xl flex items-center justify-center transition">♖</button>
                <button onclick="selectPromotion('b')" class="w-14 h-14 bg-slate-700 hover:bg-indigo-600 rounded-xl text-3xl flex items-center justify-center transition">♗</button>
                <button onclick="selectPromotion('n')" class="w-14 h-14 bg-slate-700 hover:bg-indigo-600 rounded-xl text-3xl flex items-center justify-center transition">♘</button>
            </div>
        </div>
    </div>

    <script>
        const pieceSymbols = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚',
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'
        };

        let game = new Chess();
        let selectedSquare = null;
        let possibleMoves = [];
        let pendingPromotion = null;

        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const modalEl = document.getElementById('gameModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const mainMenuEl = document.getElementById('mainMenu');
        const promotionModalEl = document.getElementById('promotionModal');
        const menuDifficultyEl = document.getElementById('menuDifficulty');
        const activeDifficultyText = document.getElementById('activeDifficultyText');

        let currentDifficulty = 'normal';

        function startGame() {
            currentDifficulty = menuDifficultyEl.value;
            activeDifficultyText.textContent = menuDifficultyEl.options[menuDifficultyEl.selectedIndex].text;
            mainMenuEl.classList.add('hidden');
            resetGame();
        }

        function returnToMenu() {
            mainMenuEl.classList.remove('hidden');
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            const board = game.board();
            
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareId = String.fromCharCode(97 + c) + (8 - r);
                    const square = board[r][c];
                    const isDark = (r + c) % 2 === 1;
                    const isSelected = selectedSquare === squareId;
                    const isPossible = possibleMoves.includes(squareId);

                    const sqEl = document.createElement('div');
                    sqEl.className = `flex items-center justify-center text-4xl cursor-pointer relative ${
                        isDark ? 'bg-amber-900/60' : 'bg-amber-100/80'
                    } ${isSelected ? 'ring-4 ring-indigo-500 inset-0' : ''}`;
                    
                    if (isPossible) {
                        const dot = document.createElement('div');
                        dot.className = 'absolute w-4 h-4 bg-indigo-500/60 rounded-full';
                        sqEl.appendChild(dot);
                    }

                    if (square) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.textContent = pieceSymbols[square.color === 'w' ? square.type.toUpperCase() : square.type];
                        pieceSpan.className = `${square.color === 'w' ? 'text-white drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]' : 'text-slate-950'} font-bold transition-transform hover:scale-110`;
                        sqEl.appendChild(pieceSpan);
                    }

                    sqEl.addEventListener('click', () => handleSquareClick(squareId));
                    boardEl.appendChild(sqEl);
                }
            }
            updateStatus();
        }

        function handleSquareClick(squareId) {
            if (game.game_over()) return;

            if (selectedSquare === null) {
                const piece = game.get(squareId);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = squareId;
                    possibleMoves = game.moves({ square: squareId, verbose: true }).map(m => m.to);
                    renderBoard();
                }
            } else {
                const moves = game.moves({ square: selectedSquare, verbose: true });
                const targetMove = moves.find(m => m.to === squareId);

                if (targetMove) {
                    if (targetMove.promotion) {
                        pendingPromotion = { from: selectedSquare, to: squareId };
                        promotionModalEl.classList.remove('hidden');
                        promotionModalEl.classList.add('flex');
                        return;
                    }

                    executeMove({ from: selectedSquare, to: squareId, promotion: 'q' });
                } else {
                    const piece = game.get(squareId);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = squareId;
                        possibleMoves = game.moves({ square: squareId, verbose: true }).map(m => m.to);
                        renderBoard();
                    } else {
                        selectedSquare = null;
                        possibleMoves = [];
                        renderBoard();
                    }
                }
            }
        }

        function selectPromotion(pieceType) {
            promotionModalEl.classList.add('hidden');
            promotionModalEl.classList.remove('flex');
            if (pendingPromotion) {
                executeMove({ from: pendingPromotion.from, to: pendingPromotion.to, promotion: pieceType });
                pendingPromotion = null;
            }
        }

        function executeMove(moveDetails) {
            const move = game.move(moveDetails);
            selectedSquare = null;
            possibleMoves = [];

            if (move) {
                renderBoard();
                if (!game.game_over()) {
                    setTimeout(makeAIMove, 300);
                }
            }
        }

        function makeAIMove() {
            if (game.game_over()) return;

            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            let selectedMove;

            if (currentDifficulty === 'easy') {
                // Kolay mod: Tamamen rastgele hamle yapar, bazen saçmalar
                selectedMove = moves[Math.floor(Math.random() * moves.length)];
            } else if (currentDifficulty === 'normal') {
                // Normal mod: Taş alabiliyorsa alır, yoksa rastgele oynar
                const captures = moves.filter(m => m.captured);
                selectedMove = captures.length > 0 ? captures[Math.floor(Math.random() * captures.length)] : moves[Math.floor(Math.random() * moves.length)];
            } else {
                // Zor mod: Basit ağırlıklandırma (taş yemeyi önceliklendirir)
                selectedMove = moves.reduce((best, m) => (m.captured ? m : best), moves[0]);
            }

            game.move(selectedMove);
            renderBoard();
            checkGameOver();
        }

        function updateStatus() {
            let statusText = '';
            const turn = game.turn() === 'w' ? 'Beyaz' : 'Siyah';

            if (game.in_checkmate()) {
                statusText = `Şah Mat! Kazanan: ${game.turn() === 'w' ? 'Siyah' : 'Beyaz'}`;
                showModal(game.turn() === 'w' ? 'Kaybettiniz!' : 'Kazandınız!', statusText);
            } else if (game.in_draw()) {
                statusText = 'Oyun Berabere!';
                showModal('Beraberlik', 'Oyun berabere bitti.');
            } else {
                statusText = `Sıra: ${turn}`;
                if (game.in_check()) statusText += ' (ŞAH!)';
            }
            statusEl.textContent = statusText;
        }

        function checkGameOver() {
            if (game.game_over()) {
                updateStatus();
            }
        }

        function showModal(title, msg) {
            modalTitle.textContent = title;
            modalMessage.textContent = msg;
            modalEl.classList.remove('hidden');
            modalEl.classList.add('flex');
        }

        function closeModal() {
            modalEl.classList.add('hidden');
            modalEl.classList.remove('flex');
        }

        function resetGame() {
            game.reset();
            selectedSquare = null;
            possibleMoves = [];
            closeModal();
            renderBoard();
        }

        renderBoard();
    </script>
</body>
</html>
